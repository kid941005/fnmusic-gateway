# ============================================================================
# fnmusic 全家桶·轻量版：2 个镜像、3 个容器，宿主机只开 2 个端口
#
#   宿主机端口 8766（网关）/ 8767（公网只读播放）
#   音源容器不映射任何端口，只在内部网络以 fnmusic-sources:8001 供网关访问
#
# 与 docker-compose.full.yml 的区别：
#   - 音源用轻量镜像 :musicdl（只含 musicdl 单源，827 MB，无 WebUI/洛雪/网易/Node/ffmpeg）
#   - 三个容器同处内部 bridge 网络，音源端口不外露
#   - 没有 WebUI；需要网页改音源时临时叠加 docker-compose.webui.yml
#
# 首次使用（NAS 上 root）：
#   mkdir -p data sources-data
#   chown -R 1000:1000 sources-data
#   cp .env.example .env && chmod 600 .env
#   docker compose -f docker-compose.slim.yml pull
#   docker compose -f docker-compose.slim.yml up -d
#
# 自检：
#   curl -s 127.0.0.1:8766/healthz        # fallback 应为 ["musicdl"]
#   curl -s 127.0.0.1:8766/readyz
#   ss -ltnp | grep -E '876[0-9]'         # 只应看到 8766 / 8767
# ============================================================================

services:
  fnmusic-gateway:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-gateway
    restart: unless-stopped
    ports:
      - "8766:8766"
      - "${GW_PUBLIC_PORT:-8767}:8767"
    networks: [fnmusic]
    depends_on:
      - fnmusic-sources
    environment:
      GW_PORT: "8766"
      GW_PUBLIC_PORT: "8767"
      GW_PUBLIC_BASE: "${GW_PUBLIC_BASE:-http://192.168.50.100:8767}"
      GW_URL_TTL: "900"
      GW_CACHE_MAX_BYTES: "8589934592"
      GW_MP3_BITRATE: "128k"
      GW_MAX_LIMIT: "${GW_MAX_LIMIT:-50}"
      GW_TRANSCODE_CONCURRENCY: "${GW_TRANSCODE_CONCURRENCY:-2}"
      GW_MCP_TIMEOUT: "${GW_MCP_TIMEOUT:-300}"
      GW_QUALITY_DEFAULT: "${GW_QUALITY_DEFAULT:-standard}"
      GW_TEE_SAVE: "${GW_TEE_SAVE:-true}"
      GW_LIBRARY_MAX_BYTES: "${GW_LIBRARY_MAX_BYTES:-0}"
      GW_SIGN_SECRET: "${GW_SIGN_SECRET:-}"
      FNMUSIC_BASE: "${FNMUSIC_BASE:-http://192.168.50.100:59820}"
      FNMUSIC_USER: "${FNMUSIC_USER:-KID}"
      FNMUSIC_PASS: "${FNMUSIC_PASS:-}"
      FNMUSIC_DEVICE_ID: "${FNMUSIC_DEVICE_ID:-}"
      GW_FALLBACK_URLS: "${GW_FALLBACK_URLS:-musicdl@http://fnmusic-sources:8001}"
      GW_DOWNLOAD_DIR: "${GW_DOWNLOAD_DIR:-/vol1/1000/Music}"
      GW_LIBRARY_SCAN_CMD: "${GW_LIBRARY_SCAN_CMD:-}"
      GW_PREVIEW_MIN_SECONDS: "${GW_PREVIEW_MIN_SECONDS:-35}"
    volumes:
      - ./data:/data

  fnmusic-bridge:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-bridge
    restart: unless-stopped
    networks: [fnmusic]
    depends_on:
      - fnmusic-gateway
    command: ["python", "-u", "bridge/mcp_pipe_http.py"]
    healthcheck:
      disable: true
    environment:
      MCP_ENDPOINT: "${MCP_ENDPOINT:-}"
      GW_MCP_URL: "http://fnmusic-gateway:8766/mcp"
      GW_TIMEOUT: "120"

  fnmusic-sources:
    image: ${FNMUSIC_SOURCES_IMAGE:-ghcr.io/kid941005/fnos_music_ext:musicdl}
    container_name: fnmusic-sources
    restart: unless-stopped
    networks: [fnmusic]
    # 不再映射任何宿主机端口
    volumes:
      - ./sources-data:/data
    environment:
      MUSICDL_SOURCES: "${MUSICDL_SOURCES:-KuwoMusicClient,MiguMusicClient}"
      MUSICDL_LIMIT_PER_SOURCE: "${MUSICDL_LIMIT_PER_SOURCE:-10}"
      # 3.1.1 新增：官方聚合搜索实验开关；默认沿用旧版（带熔断/自适应超时/逐首探活）
      FNMUSIC_MUSICDL_OFFICIAL_SEARCH: "${FNMUSIC_MUSICDL_OFFICIAL_SEARCH:-false}"

networks:
  fnmusic:
    driver: bridge

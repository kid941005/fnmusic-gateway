services:
  fnmusic-gateway:
    # 默认用 CI 发布到 GHCR 的镜像（amd64/arm64 双架构）；本地自己构建就注释掉 image、取消 build 注释
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:1.1.0}
    # build: .
    container_name: fnmusic-gateway
    restart: unless-stopped
    # 设备要直连这个端口，用 host 网络最省事（飞牛上 Docker 默认支持）
    network_mode: host
    environment:
      GW_PORT: "8766"
      # 设备访问网关用的地址：必须是设备能 ping 通的 NAS 局域网地址
      GW_PUBLIC_BASE: "${GW_PUBLIC_BASE:-http://192.168.50.100:8766}"
      GW_URL_TTL: "900"
      GW_CACHE_MAX_BYTES: "8589934592"
      GW_MP3_BITRATE: "128k"
      # 不填则自动生成并持久化到 /data/sign.key
      GW_SIGN_SECRET: "${GW_SIGN_SECRET:-}"
      # 飞牛音乐
      FNMUSIC_BASE: "${FNMUSIC_BASE:-http://192.168.50.100:59820}"
      FNMUSIC_USER: "${FNMUSIC_USER:-KID}"
      FNMUSIC_PASS: "${FNMUSIC_PASS:-}"
      FNMUSIC_DEVICE_ID: "${FNMUSIC_DEVICE_ID:-}"
    volumes:
      - ./data:/data

  # 把 9 个音乐工具挂到小智「MCP 接入点」（wss://.../mcp_endpoint/mcp/?token=...）
  # 不填 MCP_ENDPOINT 就只跑网关，桥接器连不上会一直重试（不影响网关）
  fnmusic-bridge:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:1.1.0}
    container_name: fnmusic-bridge
    restart: unless-stopped
    network_mode: host
    depends_on:
      - fnmusic-gateway
    command: ["python", "-u", "bridge/mcp_pipe_http.py"]
    # 镜像自带的是网关的 /healthz 探针，桥接器不监听端口，必须关掉
    healthcheck:
      disable: true
    environment:
      MCP_ENDPOINT: "${MCP_ENDPOINT:-}"
      GW_MCP_URL: "http://127.0.0.1:8766/mcp"
      GW_TIMEOUT: "120"

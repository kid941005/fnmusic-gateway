name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 Git ref，留空则用当前分支；补推历史版本可填 v2.7.0"
        required: false
      tag:
        description: "额外推送的 Docker 标签，留空则不追加；补推历史版本可填 2.7.0"
        required: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository_owner }}/fnmusic-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Gateway tests
        run: python tests/test_gateway.py -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          ver=$(python -c "import gwlib; print(gwlib.__version__)")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            want="$INPUT_TAG"
            if [ -z "$want" ]; then
              case "${GITHUB_REF}" in
                refs/tags/v*) want="${GITHUB_REF_NAME}" ;;
                *) echo "workflow_dispatch 构建必须填写 tag，或选择 v* tag"; exit 1 ;;
              esac
            fi
            case "$want" in v*) ;; *) want="v$want" ;; esac
          else
            want="${GITHUB_REF_NAME}"
          fi
          test "$want" = "v$ver" || { echo "tag $want != package version $ver"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Resolve image list
        id: images
        run: |
          {
            echo 'images<<EOF'
            echo '${{ env.GHCR_IMAGE }}'
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo '${{ env.DOCKERHUB_IMAGE }}'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

# ============================================================================
# fnmusic-gateway 单镜像单端口 compose（原生在线音源，无需 fnmusic-ext 容器）
#
# 只发布 1 个宿主机端口 8766：
#   浏览器 → http://NAS_IP:8766/          原生首页与设置页
#   小智   → http://NAS_IP:8766/mcp        MCP
#   设备   → http://NAS_IP:8766/play/...   签名直链
#
# 首次使用：
#   mkdir -p data music
#   cp .env.example .env && chmod 600 .env    # 至少要填 GW_ADMIN_TOKEN
#   docker compose pull && docker compose up -d
#
# 在线音源（musicdl）已内置在网关镜像里，平台、条数、超时都能在网页「设置」里改，
# 保存后写 data/config.json 并立即生效；下面的 GW_ONLINE_* 只是首次启动的默认值。
# ============================================================================

services:
  # ---- 网关：REST / MCP / 原生 WebUI / 播放直链 / 内置在线音源，全部走 8766 ----
  fnmusic-gateway:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:2.8.0}   # 升级版本时同步这里；想自动跟随最新可改成 :latest
    container_name: fnmusic-gateway
    restart: unless-stopped
    ports:
      - "8766:8766"                      # 唯一对外端口；不要加别的映射
    networks: [fnmusic]
    environment:
      GW_ADMIN_TOKEN: "${GW_ADMIN_TOKEN:?请先在 .env 设置 GW_ADMIN_TOKEN}"   # 管理接口/MCP/WebUI 的令牌
      GW_PUBLIC_BASE: "${GW_PUBLIC_BASE:-}"   # 返回给设备的直链前缀，必须是设备可访问的宿主机地址
      GW_DOWNLOAD_DIR: "/music"          # 下载/边播边存的容器内目录，必须与下面的挂载右侧一致

      # 在线音源（musicdl）首次启动默认值；启动后可在网页「设置 → 在线音源」修改
      GW_ONLINE_ENABLED: "${GW_ONLINE_ENABLED:-true}"
      GW_ONLINE_PLATFORMS: "${GW_ONLINE_PLATFORMS:-KuwoMusicClient,MiguMusicClient}"
      GW_ONLINE_SEARCH_LIMIT: "${GW_ONLINE_SEARCH_LIMIT:-10}"
      GW_ONLINE_TIMEOUT: "${GW_ONLINE_TIMEOUT:-25}"
      GW_ONLINE_TOTAL_LIMIT: "${GW_ONLINE_TOTAL_LIMIT:-50}"
      GW_ONLINE_TOTAL_TIMEOUT: "${GW_ONLINE_TOTAL_TIMEOUT:-40}"

      # 飞牛音乐（可选）：也可以启动后在网页「设置」里填，网页填的值优先
      GW_FNOS_BASE: "${GW_FNOS_BASE:-}"
      GW_FNOS_USER: "${GW_FNOS_USER:-}"
      GW_FNOS_PASS: "${GW_FNOS_PASS:-}"
    volumes:
      - ./data:/data                     # 配置、签名密钥、缓存、歌词、飞牛 token、musicdl 临时文件
      - "${GW_MUSIC_DIR:-./music}:/music"   # 本地下载目录（宿主机目录可改）

  # ---- 桥接器：仅在用「小智 MCP 接入点(wss)」时需要；不用可整段删掉 ----
  fnmusic-bridge:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:2.8.0}
    container_name: fnmusic-bridge
    restart: unless-stopped
    networks: [fnmusic]
    depends_on:
      - fnmusic-gateway
    command: ["python", "-u", "bridge/mcp_pipe_http.py"]
    healthcheck:
      disable: true                      # 它只是长连接客户端，没有可探的端口
    environment:
      MCP_ENDPOINT: "${MCP_ENDPOINT:-}"                           # 小智接入点地址；留空会一直重连（不影响网关）
      GW_MCP_URL: "http://fnmusic-gateway:8766/mcp"                # 容器内直连网关
      GW_ADMIN_TOKEN: "${GW_ADMIN_TOKEN:?请先在 .env 设置 GW_ADMIN_TOKEN}"

networks:
  fnmusic:
    driver: bridge

# ============================================================================
# fnmusic 单端口版：3 个容器，宿主机只发布 1 个端口（8766）
#
#   浏览器/小智/设备都只访问 8766：
#     - WebUI      http://NAS_IP:8766/app/fnmusic-ext/
#     - MCP        http://NAS_IP:8766/mcp
#     - REST/播放  http://NAS_IP:8766/api/...、/play/...
#     - 音源容器不映射任何宿主机端口，只在内部网络 fnmusic 里访问
#
# 安全模型：
#   - GW_ADMIN_TOKEN 保护管理接口、MCP 与 WebUI（/play/、/lyrics/、/healthz 匿名）
#   - 公网只让 Lucky/nginx 反代 8766，并且只转发 /play/ 与 /lyrics/
#   - WebUI 首次访问：http://NAS_IP:8766/app/fnmusic-ext/?token=<GW_ADMIN_TOKEN>
#     网关校验后写入 HttpOnly Cookie 并 302 去掉 URL 里的 token
#
# 首次使用（NAS 上 root）：
#   mkdir -p data sources-data sources-repo music
#   chown -R 1000:1000 sources-data sources-repo music
#   cp .env.example .env && chmod 600 .env
#   # 必须在 .env 里设置一个足够长的 GW_ADMIN_TOKEN（openssl rand -hex 24）
#   docker compose pull
#   docker compose up -d
#
# 自检：
#   curl -s 127.0.0.1:8766/healthz
#   curl -s -H "X-Admin-Token: $GW_ADMIN_TOKEN" 127.0.0.1:8766/api/quality
#   ss -ltnp | grep 8766                  # 只应看到 8766
# ============================================================================

services:
  fnmusic-gateway:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-gateway
    restart: unless-stopped
    ports:
      - "8766:8766"
    networks: [fnmusic]
    depends_on:
      - fnmusic-sources
    environment:
      GW_PORT: "8766"
      # 设备/公网可访问的地址；留空按请求 Host 推导（Lucky 反代时通常不用填）
      GW_PUBLIC_BASE: "${GW_PUBLIC_BASE:-}"
      GW_ADMIN_TOKEN: "${GW_ADMIN_TOKEN:?请先在 .env 设置 GW_ADMIN_TOKEN}"
      GW_WEBUI_URL: "${GW_WEBUI_URL:-http://fnmusic-sources:8004}"
      GW_WEBUI_TIMEOUT: "${GW_WEBUI_TIMEOUT:-30}"
      GW_URL_TTL: "900"
      GW_CACHE_MAX_BYTES: "8589934592"
      GW_MP3_BITRATE: "128k"
      GW_MAX_LIMIT: "${GW_MAX_LIMIT:-50}"
      GW_TRANSCODE_CONCURRENCY: "${GW_TRANSCODE_CONCURRENCY:-2}"
      GW_MCP_TIMEOUT: "${GW_MCP_TIMEOUT:-300}"
      GW_QUALITY_DEFAULT: "${GW_QUALITY_DEFAULT:-standard}"
      GW_TEE_SAVE: "${GW_TEE_SAVE:-true}"
      GW_LIBRARY_MAX_BYTES: "${GW_LIBRARY_MAX_BYTES:-0}"
      GW_SIGN_SECRET: "${GW_SIGN_SECRET:-}"
      GW_FALLBACK_URLS: "${GW_FALLBACK_URLS:-musicdl@http://fnmusic-sources:8001}"
      GW_DOWNLOAD_DIR: "${GW_DOWNLOAD_DIR:-/music}"
      GW_PREVIEW_MIN_SECONDS: "${GW_PREVIEW_MIN_SECONDS:-35}"
    volumes:
      - ./data:/data
      # 本地曲库（下载/边播边存落盘）。右侧必须与 GW_DOWNLOAD_DIR 一致
      - "${GW_MUSIC_DIR:-./music}:/music"

  fnmusic-bridge:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-bridge
    restart: unless-stopped
    networks: [fnmusic]
    depends_on:
      - fnmusic-gateway
    command: ["python", "-u", "bridge/mcp_pipe_http.py"]
    healthcheck:
      disable: true
    environment:
      MCP_ENDPOINT: "${MCP_ENDPOINT:-}"
      GW_MCP_URL: "http://fnmusic-gateway:8766/mcp"
      GW_ADMIN_TOKEN: "${GW_ADMIN_TOKEN:?请先在 .env 设置 GW_ADMIN_TOKEN}"
      GW_TIMEOUT: "120"

  fnmusic-sources:
    # 默认轻量 WebUI 镜像（musicdl + 管理界面，906MB）；
    # 需要网易/洛雪时改成 :latest 全量镜像，内部端口仍是 8001/8004
    image: ${FNMUSIC_SOURCES_IMAGE:-ghcr.io/kid941005/fnos_music_ext:musicdl-webui}
    container_name: fnmusic-sources
    restart: unless-stopped
    networks: [fnmusic]
    # 不映射任何宿主机端口
    volumes:
      - ./sources-data:/data
      - ./sources-repo:/repo
    environment:
      FNMUSIC_MUSICDL_ENABLED: "true"
      FNMUSIC_WEBUI_ENABLED: "true"
      MUSICDL_SOURCES: "${MUSICDL_SOURCES:-KuwoMusicClient,MiguMusicClient}"
      MUSICDL_LIMIT_PER_SOURCE: "${MUSICDL_LIMIT_PER_SOURCE:-10}"
      FNMUSIC_MUSICDL_OFFICIAL_SEARCH: "${FNMUSIC_MUSICDL_OFFICIAL_SEARCH:-false}"

networks:
  fnmusic:
    driver: bridge

# ============================================================================
# fnmusic 全家桶：网关（含桥接器）+ 在线音源容器，两个镜像、三个容器
#
#   镜像 1  ghcr.io/kid941005/fnmusic-gateway:latest   → fnmusic-gateway + fnmusic-bridge
#   镜像 2  ghcr.io/kid941005/fnos_music_ext:latest    → fnmusic-sources（音源 + 管理 WebUI）
#
# 首次使用（在 NAS 上以 root 执行）：
#   mkdir -p data sources-data sources-repo
#   chown -R 1000:1000 sources-data sources-repo      # 容器内以 uid 1000 运行，必须可写
#   cp .env.example .env && chmod 600 .env            # 填 FNMUSIC_PASS / MCP_ENDPOINT 等（见下）
#   docker compose -f docker-compose.full.yml pull
#   docker compose -f docker-compose.full.yml up -d
#
# 自检：
#   curl -s 127.0.0.1:8766/healthz          # 网关；fallback 应含 musicdl
#   curl -s 127.0.0.1:8768/healthz          # 音源（musicdl）
#   curl -s 127.0.0.1:8774/healthz          # 音源管理 WebUI
#
# 音源切换：推荐用 WebUI（http://127.0.0.1:8774，SSH 隧道访问），保存后秒级生效；
# WebUI 会把配置写进 ./sources-repo/.env（.env 优先级高于下面的 environment）。
# ============================================================================

services:
  # ----
  # 1) 网关：MCP + 签名直链 + 歌词 + 多音源兜底
  # ----
  fnmusic-gateway:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-gateway
    restart: unless-stopped
    network_mode: host            # 设备要直连 8766/8767，host 最省事
    depends_on:
      - fnmusic-sources
    environment:
      GW_PORT: "8766"
      GW_PUBLIC_PORT: "${GW_PUBLIC_PORT:-8767}"          # 公网只反代这个端口（只放 /play/ 与 /lyrics/）
      GW_PUBLIC_BASE: "${GW_PUBLIC_BASE:-http://192.168.50.100:8766}"
      GW_URL_TTL: "900"
      GW_CACHE_MAX_BYTES: "8589934592"
      GW_MP3_BITRATE: "128k"
      GW_MAX_LIMIT: "${GW_MAX_LIMIT:-50}"
      GW_TRANSCODE_CONCURRENCY: "${GW_TRANSCODE_CONCURRENCY:-2}"
      GW_QUALITY_DEFAULT: "${GW_QUALITY_DEFAULT:-standard}"
      GW_TEE_SAVE: "${GW_TEE_SAVE:-true}"
      GW_LIBRARY_MAX_BYTES: "${GW_LIBRARY_MAX_BYTES:-0}"
      GW_SIGN_SECRET: "${GW_SIGN_SECRET:-}"              # 空=自动生成 /data/sign.key
      # —— 飞牛音乐本地库 ——
      FNMUSIC_BASE: "${FNMUSIC_BASE:-http://192.168.50.100:59820}"
      FNMUSIC_USER: "${FNMUSIC_USER:-KID}"
      FNMUSIC_PASS: "${FNMUSIC_PASS:-}"
      FNMUSIC_DEVICE_ID: "${FNMUSIC_DEVICE_ID:-}"
      # —— 多音源兜底（本地没有才用在线源）——
      # 类型@地址，按端口自动识别：8768=musicdl 8770=musicbox 8772=lxmusic 8776=neteasefree
      GW_FALLBACK_URLS: "${GW_FALLBACK_URLS:-musicdl@http://127.0.0.1:8768}"
      # 收藏在线歌曲时落盘到飞牛曲库的目录（宿主机路径）
      GW_DOWNLOAD_DIR: "${GW_DOWNLOAD_DIR:-/vol1/1000/Music}"
      # 下载完想让飞牛立刻扫到，就填扫描命令，例如：/usr/local/bin/fnmusic-ext scan
      GW_LIBRARY_SCAN_CMD: "${GW_LIBRARY_SCAN_CMD:-}"
      GW_PREVIEW_MIN_SECONDS: "${GW_PREVIEW_MIN_SECONDS:-35}"
    volumes:
      - ./data:/data

  # ----
  # 2) 桥接器：把 9 个音乐工具挂到小智「MCP 接入点」（wss）。同一镜像，换 command。
  #    不用接入点（走全局 MCP 配置或插件直连 REST）可以整段删掉。
  # ----
  fnmusic-bridge:
    image: ${GW_IMAGE:-ghcr.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-bridge
    restart: unless-stopped
    network_mode: host
    depends_on:
      - fnmusic-gateway
    command: ["python", "-u", "bridge/mcp_pipe_http.py"]
    healthcheck:
      disable: true                # 镜像自带的是网关探针，桥接器不监听端口，必须关
    environment:
      MCP_ENDPOINT: "${MCP_ENDPOINT:-}"
      GW_MCP_URL: "http://127.0.0.1:8766/mcp"
      GW_TIMEOUT: "120"

  # ----
  # 3) 在线音源容器（fnos_music_ext）：musicdl / 网易 / 洛雪 + 管理 WebUI
  #    注意：同一时刻只启用一个音源（下面三个开关只留一个 true）
  #    端口全绑 127.0.0.1，不对局域网/公网暴露
  # ----
  fnmusic-sources:
    image: ${FNMUSIC_SOURCES_IMAGE:-ghcr.io/kid941005/fnos_music_ext:latest}
    container_name: fnmusic-sources
    restart: unless-stopped
    ports:
      - "127.0.0.1:8768:8001"     # musicdl
      - "127.0.0.1:8770:8002"     # 网易云 / musicbox
      - "127.0.0.1:8772:8003"     # 洛雪 lxmusic
      - "127.0.0.1:8774:8004"     # 管理 WebUI
    volumes:
      - ./sources-data:/data      # 登录态、洛雪源脚本、日志
      - ./sources-repo:/repo      # WebUI 读写的 .env（首次可为空）
      - /run/fnmusic-ext:/run/fnmusic-ext:ro   # 装宿主代理时才需要，没有就留空目录
      # 想让音源自己「边听边存/收藏下载」直接进曲库，再挂这一行并设 FNMUSIC_TEE_SAVE_DIR=/music
      # - "${GW_DOWNLOAD_DIR:-/vol1/1000/Music}:/music"
    environment:
      # —— 只启用一个音源 ——
      FNMUSIC_MUSICDL_ENABLED: "true"
      FNMUSIC_NETEASE_ENABLED: "false"
      FNMUSIC_LX_ENABLED: "false"
      # 管理 WebUI（默认开）
      FNMUSIC_WEBUI_ENABLED: "true"
      # 若上面挂了 /music，这里改成 /music
      FNMUSIC_TEE_SAVE_DIR: ""
      # 洛雪自定义源（启用 lxmusic 时再填）
      # LX_SOURCE_URL: ""

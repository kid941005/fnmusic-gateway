# ============================================================================
# fnmusic-gateway 单端口版 compose
#
# 只发布 1 个宿主机端口 8766，三个容器都在内部网络 fnmusic 上：
#   浏览器 → http://NAS_IP:8766/             WebUI（音源管理台 + 网关设置）
#   小智   → http://NAS_IP:8766/mcp          MCP
#   设备   → http://NAS_IP:8766/play/...     签名直链
#
# 首次使用：
#   mkdir -p data sources-data sources-repo music && chown -R 1000:1000 sources-data sources-repo music
#   cp .env.example .env && chmod 600 .env    # 至少要填 GW_ADMIN_TOKEN
#   docker compose pull && docker compose up -d
#
# 说明：这里只写“必须在 compose 里给定”的变量；其余参数都有代码默认值，
#       需要调（缓存大小/转码并发/歌词/音质等）时看 README 的「环境变量」再往 environment 里加。
# ============================================================================

services:
  # ---- 网关：REST / MCP / WebUI 反代 / 播放直链，全部走 8766 ----
  fnmusic-gateway:
    image: ${GW_IMAGE:-docker.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-gateway
    restart: unless-stopped
    ports:
      - "8766:8766"                      # 唯一对外端口；不要加别的映射
    networks: [fnmusic]
    depends_on:
      - fnmusic-sources                  # 只保证启动顺序，不等待健康
    environment:
      GW_ADMIN_TOKEN: "${GW_ADMIN_TOKEN:?请先在 .env 设置 GW_ADMIN_TOKEN}"   # 管理接口/MCP/WebUI 的令牌
      GW_WEBUI_URL: "${GW_WEBUI_URL:-http://fnmusic-sources:8004}"           # WebUI 上游（音源容器的管理台）
      GW_FALLBACK_URLS: "${GW_FALLBACK_URLS:-musicdl@http://fnmusic-sources:8001}"  # 在线兜底音源
      GW_DOWNLOAD_DIR: "/music"          # 下载/边播边存的容器内目录，必须与下面的挂载右侧一致

      # 飞牛音乐（可选）：也可以启动后在 WebUI「网关设置」里填，网页填的值优先
      GW_FNOS_BASE: "${GW_FNOS_BASE:-}"
      GW_FNOS_USER: "${GW_FNOS_USER:-}"
      GW_FNOS_PASS: "${GW_FNOS_PASS:-}"
    volumes:
      - ./data:/data                     # 配置、签名密钥、缓存、歌词、飞牛 token
      - "${GW_MUSIC_DIR:-./music}:/music"   # 本地下载目录（宿主机目录可改）

  # ---- 桥接器：仅在用「小智 MCP 接入点(wss)」时需要；不用可整段删掉 ----
  fnmusic-bridge:
    image: ${GW_IMAGE:-docker.io/kid941005/fnmusic-gateway:latest}
    container_name: fnmusic-bridge
    restart: unless-stopped
    networks: [fnmusic]
    depends_on:
      - fnmusic-gateway
    command: ["python", "-u", "bridge/mcp_pipe_http.py"]
    healthcheck:
      disable: true                      # 它只是长连接客户端，没有可探的端口
    environment:
      MCP_ENDPOINT: "${MCP_ENDPOINT:-}"                           # 小智接入点地址；留空会一直重连（不影响网关）
      GW_MCP_URL: "http://fnmusic-gateway:8766/mcp"                # 容器内直连网关
      GW_ADMIN_TOKEN: "${GW_ADMIN_TOKEN:?请先在 .env 设置 GW_ADMIN_TOKEN}"

  # ---- 音源容器：musicdl + WebUI，只在内部网络，不映射任何宿主机端口 ----
  fnmusic-sources:
    image: ${FNMUSIC_SOURCES_IMAGE:-ghcr.io/kid941005/fnos_music_ext:musicdl-webui}
    container_name: fnmusic-sources
    restart: unless-stopped
    networks: [fnmusic]
    volumes:
      - ./sources-data:/data             # 音源容器数据（登录态、缓存）
      - ./sources-repo:/repo             # 音源插件/脚本目录
    environment:
      FNMUSIC_MUSICDL_ENABLED: "true"    # 启用 musicdl 搜索源（内部 8001）
      FNMUSIC_WEBUI_ENABLED: "true"      # 启用 WebUI（内部 8004，由网关反代）
      MUSICDL_SOURCES: "${MUSICDL_SOURCES:-KuwoMusicClient,MiguMusicClient}"   # 启用的音乐站
      MUSICDL_LIMIT_PER_SOURCE: "${MUSICDL_LIMIT_PER_SOURCE:-10}"              # 每站返回条数
      FNMUSIC_MUSICDL_OFFICIAL_SEARCH: "false"   # 用旧版逐站搜索（上游新装默认 true，这里保持原行为）

networks:
  fnmusic:
    driver: bridge
